# Jaeger v2 all-in-one, in-memory: the "standard otel" trace UI for lab 7 (the branch disables the demo's Jaeger).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: lab7
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.22.0
        ports:
        - {name: ui, containerPort: 16686}
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: lab7
spec:
  selector: {app: jaeger}
  ports:
  - {name: ui, port: 16686}
  - {name: otlp-grpc, port: 4317}
  - {name: otlp-http, port: 4318}
